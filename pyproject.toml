[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "setuptools-git-versioning",
]
build-backend = "setuptools.build_meta"

[project]
name = "mcpBlender-tspspi"
dynamic = ["version"]
description = "Authenticated MCP control of live Blender sessions over private Unix sockets"
readme = "README.md"
authors = [
    {name = "Thomas Spielauer", email = "pypipackages01@tspi.at"},
]
requires-python = ">=3.11"
dependencies = ["fastmcp>=4,<5", "pydantic>=2.5,<3", "argon2-cffi>=23.1"]

[project.optional-dependencies]
remote = ["fastapi>=0.110", "uvicorn>=0.24"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mcpblender = "mcpblender.server:main"

[tool.setuptools-git-versioning]
enabled = true
starting_version = "0.2.0"

[tool.setuptools.packages.find]
include = ["mcpblender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["blender: integration test using an installed Blender binary"]
