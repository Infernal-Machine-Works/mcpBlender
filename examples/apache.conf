# Inside an existing HTTPS virtual host. The MCP server binds loopback TCP.
ProxyPass        /blender/ http://127.0.0.1:18081/ timeout=180
ProxyPassReverse /blender/ http://127.0.0.1:18081/

# Use a dedicated access log format without the query string or request headers.
# %r includes query credentials; %U excludes them. Apply the same rule to any
# inherited/global logs and avoid request-target debug logging.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" mcp_without_query
CustomLog /var/log/httpd/blender-access.log mcp_without_query
