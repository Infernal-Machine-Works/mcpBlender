{
  "mode": "stdio",
  "bridge": {
    "socket_path": "~/.local/state/mcpblender/bridge.sock",
    "timeout_seconds": 120
  },
  "launch": {
    "executable": "blender",
    "background": false,
    "factory_startup": true,
    "startup_timeout_seconds": 30,
    "log_path": "~/.local/state/mcpblender/blender.log",
    "auto_start": true,
    "auto_recover": true,
    "max_recovery_attempts": 3,
    "checkpoint_interval_seconds": 30,
    "checkpoint_copies": 3,
    "shutdown_on_exit": false
  },
  "stdio": {
    "library_root": "~/blender-mcp-library",
    "allow_code_execution": true,
    "allow_library_write": true,
    "allow_snapshots": true,
    "allow_scene_edit": true,
    "allow_start_blender": true,
    "enable_autonomous_execution": true,
    "allow_shutdown_blender": true,
    "allow_external_assets": true
  },
  "remote_server": {
    "host": "127.0.0.1",
    "port": 18081,
    "uds": null,
    "url_prefix": "https://mcp.example.com/blender/"
  },
  "api_keys": [],
  "storage": {
    "reserve_bytes": 268435456,
    "warn_below_bytes": 2147483648
  },
  "asset_sources": {}
}
